apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "postgres"
        vault.hashicorp.com/agent-inject-secret-db-creds: "secret/data/applicationbib/db"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "secret/data/applicationbib/db" -}}
          export POSTGRES_DB="{{ .Data.data.url | regexReplaceAll ".*\\/([^\\/]+)$" "${1}" }}"
          export POSTGRES_USER="{{ .Data.data.username }}"
          export POSTGRES_PASSWORD="{{ .Data.data.password }}"
          {{- end -}}
    spec:
      serviceAccountName: postgres-sa
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - . /vault/secrets/db-creds && exec docker-entrypoint.sh postgres
          ports:
            - containerPort: 5432

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - localhost
                - -p
                - "5432"
            initialDelaySeconds: 10
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # readOnlyRootFilesystem intentionally omitted — accepted trade-off,
            # official image needs root at startup to chown data dir (Finding #008)

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
              ephemeral-storage: "1Gi"

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc