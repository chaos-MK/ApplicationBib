apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        # UID/GID and readOnlyRootFilesystem trade-offs documented in
        # Finding #008 — suppressed here now that kube-score runs in CI
        kube-score/ignore: container-security-context-user-group-id,container-security-context-readonlyrootfilesystem
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "postgres"
        vault.hashicorp.com/agent-inject-secret-db-creds: "secret/data/applicationbib/db"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "secret/data/applicationbib/db" -}}
          export POSTGRES_DB="{{ .Data.data.url | regexReplaceAll ".*\\/([^\\/]+)$" "${1}" }}"
          export POSTGRES_USER="{{ .Data.data.username }}"
          export POSTGRES_PASSWORD="{{ .Data.data.password }}"
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-exporter-dsn: "secret/data/applicationbib/db"
        vault.hashicorp.com/agent-inject-template-exporter-dsn: |
          {{- with secret "secret/data/applicationbib/db" -}}
          export DATA_SOURCE_NAME="postgresql://{{ .Data.data.username }}:{{ .Data.data.password }}@localhost:5432/{{ .Data.data.url | regexReplaceAll ".*\\/([^\\/]+)$" "${1}" }}?sslmode=disable"
          {{- end -}}
    spec:
      serviceAccountName: postgres-sa
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - . /vault/secrets/db-creds && exec docker-entrypoint.sh postgres
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - localhost
                - -p
                - "5432"
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - DAC_OVERRIDE
                - SETUID
                - SETGID
            # readOnlyRootFilesystem intentionally omitted — accepted trade-off,
            # official image needs root at startup to chown data dir (Finding #008)
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
              ephemeral-storage: "1Gi"
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - . /vault/secrets/exporter-dsn && exec postgres_exporter
          ports:
            - containerPort: 9187
              name: metrics
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc