apiVersion: apps/v1
kind: Deployment
metadata:
  name: applicationbib
spec:
  replicas: 1
  selector:
    matchLabels:
      app: applicationbib
  template:
    metadata:
      labels:
        app: applicationbib
    spec:
      serviceAccountName: applicationbib-sa
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: applicationbib
          image: registry.gitlab.com/khalilmohamed798/applicationbib:bf8960fe
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
          ports:
            - containerPort: 8080