apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-azure-secrets
  namespace: applicationbib
spec:
  provider: azure

  parameters:
    usePodIdentity: "false"
    clientID: "${AZ_POSTGRES_CLIENT_ID}"
    keyvaultName: "${AZ_KEYVAULT_NAME}"
    tenantId: "${AZ_TENANT_ID}"
    cloudName: "AzurePublicCloud"

    objects: |
      array:
        - |
          objectName: postgres-db
          objectType: secret
          objectAlias: POSTGRES_DB
        - |
          objectName: postgres-username
          objectType: secret
          objectAlias: POSTGRES_USER
        - |
          objectName: postgres-password
          objectType: secret
          objectAlias: POSTGRES_PASSWORD
