stages:
  - test
  - build
  - smoke-test
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  GIT_DEPTH: "0"

build-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - postgres:16
  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: testdb
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
    SPRING_DATASOURCE_USERNAME: test
    SPRING_DATASOURCE_PASSWORD: test
  script:
    - mvn -B verify || (cat target/surefire-reports/*.txt && exit 1)
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/*.xml

build-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

smoke-test:
  stage: smoke-test
  image: python:3.12
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    BASE_URL: http://docker:8080
  needs:
    - build-image
  before_script:
    - apt-get update
    - apt-get install -y docker.io
  script:
    - pip install -r tests/requirements.txt
    - docker network create testnet
    - >
      docker run -d --name pg --network testnet
      -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=testdb
      postgres:16
    - >
      for i in $(seq 1 15); do docker exec pg pg_isready -U test && break; sleep 2; done
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - >
      docker run -d --name app --network testnet -p 8080:8080
      -e SPRING_DATASOURCE_URL=jdbc:postgresql://pg:5432/testdb
      -e SPRING_DATASOURCE_USERNAME=test -e SPRING_DATASOURCE_PASSWORD=test
      "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - >
      for i in $(seq 1 20); do curl -sf "$BASE_URL/actuator/health" && break; echo waiting...; sleep 3; done
    - docker ps -a
    - docker logs app || true
    - pytest tests/test_api.py --junitxml=smoke-report.xml -v
  artifacts:
    when: always
    reports:
      junit: smoke-report.xml

deploy:
  stage: deploy
  needs:
    - build-test
    - smoke-test
  script:
    - echo "Deploy goes here."