# .gitlab-ci.yml

stages:
  - secrets
  - sast
  - dependency
  - lint
  - build
  - sbom
  - image-scan

# Controls WHEN the whole pipeline runs at all (applies to every job below)
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  GIT_DEPTH: 0   # full history — needed for Gitleaks to catch old leaked secrets

# ---------- 1. SECRETS ----------
secret-scan:
  stage: secrets
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact

# ---------- 2. SAST ----------
sast-semgrep:
  stage: sast
  image: python:3.12-slim
  script:
    - pip install semgrep
    - semgrep scan --config p/java --error
    
sonarqube:
  stage: sast
  image: maven:3.9-eclipse-temurin-21
  variables:
    SONAR_HOST_URL: "https://sonarcloud.io"
  script:
    - mvn verify sonar:sonar -Dsonar.token=$SONAR_TOKEN
  allow_failure: false

# ---------- 3. DEPENDENCY / SCA ----------
dependency-scan-snyk:
  stage: dependency
  image:
    name: snyk/snyk:maven
    entrypoint: [""]
  script:
    - snyk auth $SNYK_TOKEN
    - snyk test --severity-threshold=high

# ---------- 4. DOCKERFILE LINT ----------
dockerfile-lint:
  stage: lint
  image:
    name: hadolint/hadolint:latest-debian
    entrypoint: [""]
  script:
    - hadolint Dockerfile

# ---------- 5. BUILD & PUSH IMAGE ----------
build-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

# ---------- 6. SBOM ----------
sbom-syft:
  stage: sbom
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - syft dir:. -o cyclonedx-json=sbom.json
  artifacts:
    paths:
      - sbom.json
    expire_in: 30 days

# ---------- 7. CONTAINER IMAGE SCANNING (two scanners, compared) ----------
image-scan-trivy:
  stage: image-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["build-image"]
  script:
    - trivy image
      --username $CI_REGISTRY_USER
      --password $CI_REGISTRY_PASSWORD
      --severity CRITICAL,HIGH
      --exit-code 1
      $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

image-scan-grype:
  stage: image-scan
  image: docker:24
  services:
    - docker:24-dind
  needs: ["build-image"]
  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker save $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -o image.tar
    - grype docker-archive:image.tar --fail-on high
