stages:
  - secrets
  - sast
  - dependency-sca
  - test
  - lint
  - bug-analysis
  - build
  - sbom
  - image-scan
  - manifest-validation
  - pre-deploy-checks
  - deploy
  - post-deploy-smoke
  - dast-scan
  - rollback

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  GIT_DEPTH: "0"
  
.m2-cache: &m2-cache
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository/
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# -----------------------------------------------------------------------------
# STAGE 1 — SECRET SCANNING
# -----------------------------------------------------------------------------
secret-scan:
  stage: secrets
  tags:
    - docker-ci
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact

# -----------------------------------------------------------------------------
# STAGE 2a — SEMGREP
# -----------------------------------------------------------------------------
sast-semgrep:
  stage: sast
  tags:
    - docker-ci
  image: python:3.12-slim
  script:
    - pip install semgrep
    - semgrep scan --config p/java --error

# -----------------------------------------------------------------------------
# STAGE 2b — SONARCLOUD
# -----------------------------------------------------------------------------
sonarqube:
  stage: sast
  tags:
    - docker-ci
  image: maven:3.9-eclipse-temurin-21

  <<: *m2-cache

  variables:
    SONAR_HOST_URL: https://sonarcloud.io

  script:
    - mvn clean verify -DskipTests sonar:sonar -Dsonar.token="$SONAR_TOKEN"

# -----------------------------------------------------------------------------
# STAGE 3 — SNYK
# -----------------------------------------------------------------------------
dependency-scan-snyk:
  stage: dependency-sca
  tags:
    - docker-ci
  image:
    name: snyk/snyk:maven
    entrypoint: [""]
  script:
    - snyk auth "$SNYK_TOKEN"
    - snyk test --severity-threshold=high

# -----------------------------------------------------------------------------
# STAGE 4 — BUILD & TEST (JUnit + Mockito)
# -----------------------------------------------------------------------------
build-test:
  stage: test
  tags:
    - docker-ci
  image: maven:3.9-eclipse-temurin-21

  <<: *m2-cache

  services:
    - postgres:16

  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: testdb
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
    SPRING_DATASOURCE_USERNAME: test
    SPRING_DATASOURCE_PASSWORD: test

  script:
    - mvn -B verify || (cat target/surefire-reports/*.txt && exit 1)

  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/*.xml

# -----------------------------------------------------------------------------
# STAGE 5 — DOCKERFILE LINT
# -----------------------------------------------------------------------------
dockerfile-lint:
  stage: lint
  tags:
    - docker-ci
  image:
    name: hadolint/hadolint:latest-debian
    entrypoint: [""]
  script:
    - hadolint Dockerfile

# -----------------------------------------------------------------------------
# STAGE 6 — STATIC BUG ANALYSIS (SpotBugs)
# -----------------------------------------------------------------------------
spotbugs:
  stage: bug-analysis
  tags:
    - docker-ci
  image: maven:3.9-eclipse-temurin-21

  <<: *m2-cache

  script:
    - mvn spotbugs:check

  artifacts:
    when: always
    paths:
      - target/spotbugsXml.xml
    expire_in: 7 days

# -----------------------------------------------------------------------------
# STAGE 7 — BUILD IMAGE (Buildah, no daemon)
# -----------------------------------------------------------------------------
build-image:
  stage: build
  tags:
    - docker-ci
  image: quay.io/buildah/stable
  variables:
    STORAGE_DRIVER: vfs
  script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - buildah build --layers -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - buildah push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# -----------------------------------------------------------------------------
# STAGE 8 — SBOM
# -----------------------------------------------------------------------------
sbom-syft:
  stage: sbom
  tags:
    - docker-ci
  image: alpine:3.20

  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

  script:
    - syft dir:. -o cyclonedx-json=sbom.json

  artifacts:
    paths:
      - sbom.json
    expire_in: 30 days

# -----------------------------------------------------------------------------
# STAGE 9a — TRIVY
# -----------------------------------------------------------------------------
image-scan-trivy:
  stage: image-scan
  tags:
    - docker-ci
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - build-image
  cache:
    key: trivy-db
    paths:
      - .trivycache/
  variables:
    TRIVY_CACHE_DIR: .trivycache
  script:
    - >
      trivy image
      --username "$CI_REGISTRY_USER"
      --password "$CI_REGISTRY_PASSWORD"
      --severity CRITICAL,HIGH
      --ignorefile .trivyignore
      --exit-code 1
      --timeout 15m
      "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# -----------------------------------------------------------------------------
# STAGE 9b — GRYPE (Skopeo, no daemon)
# -----------------------------------------------------------------------------
image-scan-grype:
  stage: image-scan
  tags:
    - docker-ci
  image:
    name: quay.io/skopeo/stable
    entrypoint: [""]
  needs:
    - build-image
  before_script:
    - curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
  script:
    - skopeo login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - skopeo copy "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" docker-archive:image.tar
    - grype docker-archive:image.tar --fail-on high --config .grype.yaml

# -----------------------------------------------------------------------------
# STAGE 10a — KUBECONFORM (schema validation)
# -----------------------------------------------------------------------------
kubeconform:
  stage: manifest-validation
  tags:
    - docker-ci
  image:
    name: ghcr.io/yannh/kubeconform:latest-alpine
    entrypoint: [""]
  script:
    - /kubeconform -strict -summary k8s/app/*.yaml k8s/postgres/*.yaml k8s/vault/*.yaml

# -----------------------------------------------------------------------------
# STAGE 10b — KUBE-SCORE (security & best practices)
# -----------------------------------------------------------------------------
kube-score:
  stage: manifest-validation
  tags:
    - docker-ci
  image:
    name: zegl/kube-score:latest
    entrypoint: [""]
  script:
    - kube-score score k8s/app/*.yaml k8s/postgres/*.yaml k8s/vault/*.yaml

# -----------------------------------------------------------------------------
# STAGE 11 — PRE-DEPLOYMENT ENVIRONMENT CHECKS
# -----------------------------------------------------------------------------
pre-deploy-checks:
  stage: pre-deploy-checks
  tags:
    - local-k8s

  script:
    - echo "Checking cluster is reachable..."
    - sudo /usr/local/bin/kubectl cluster-info

    - echo "Checking required namespaces exist..."
    - sudo /usr/local/bin/kubectl get namespace default vault

    - echo "Checking Vault is unsealed..."
    - sudo /usr/local/bin/kubectl exec -n vault vault-0 -- vault status

    - echo "Checking Postgres is accepting connections..."
    - sudo /usr/local/bin/kubectl exec postgres-0 -- pg_isready -h localhost -p 5432

    - echo "Checking existing app deployment is healthy..."
    - >
      sudo /usr/local/bin/kubectl get pod -l app=applicationbib
      -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}'
      | grep -q True

# -----------------------------------------------------------------------------
# STAGE 12 — DEPLOY
# -----------------------------------------------------------------------------
deploy:
  stage: deploy
  tags:
    - local-k8s
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  needs:
    - secret-scan
    - sast-semgrep
    - sonarqube
    - dependency-scan-snyk
    - build-test
    - dockerfile-lint
    - spotbugs
    - build-image
    - sbom-syft
    - image-scan-trivy
    - image-scan-grype
    - kubeconform
    - kube-score
    - pre-deploy-checks

  script:
    - 'sed -i "s|image: registry.gitlab.com/khalilmohamed798/applicationbib:.*|image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA|" k8s/app/deployment.yaml'
    - sudo /usr/local/bin/kubectl apply -f k8s/app/deployment.yaml
    - sudo /usr/local/bin/kubectl rollout status deployment/applicationbib --timeout=120s
    - git config user.email "ci-bot@applicationbib.local"
    - git config user.name "CI Deploy Bot"
    - git remote set-url origin "https://ci-deploy-bot:${DEPLOY_TOKEN}@gitlab.com/khalilmohamed798/ApplicationBib.git"
    - git add k8s/app/deployment.yaml
    - 'git commit -m "chore: deploy image $CI_COMMIT_SHORT_SHA [skip ci]" || echo "No changes to commit"'
    - git push origin HEAD:main

# -----------------------------------------------------------------------------
# STAGE 13 — POST-DEPLOYMENT SMOKE TESTS
# -----------------------------------------------------------------------------
post-deploy-smoke:
  stage: post-deploy-smoke
  tags:
    - local-k8s

  needs:
    - deploy

  variables:
    NAMESPACE: default
    KUBECTL: sudo /usr/local/bin/kubectl

  script:
    - |
      set -e

      cleanup() {
        echo "Cleaning up port-forward..."
        if [ -n "${PF_PID:-}" ]; then
          sudo kill -9 "$PF_PID" 2>/dev/null || true
        fi
        sudo pkill -f "kubectl.*port-forward.*18080" 2>/dev/null || true
      }

      trap cleanup EXIT

      echo "Waiting for pod to report Ready..."
      $KUBECTL -n "$NAMESPACE" wait \
        --for=condition=Ready \
        pod -l app=applicationbib \
        --timeout=120s

      APP_POD=$($KUBECTL -n "$NAMESPACE" get pod \
        -l app=applicationbib \
        --field-selector=status.phase=Running \
        --sort-by=.metadata.creationTimestamp \
        -o jsonpath='{.items[-1:].metadata.name}')

      if [ -z "$APP_POD" ]; then
        echo "No running pod found."
        exit 1
      fi

      echo "Using pod: $APP_POD"

      echo "Starting port-forward..."
      $KUBECTL -n "$NAMESPACE" port-forward "$APP_POD" 18080:8080 \
        >/tmp/port-forward.log 2>&1 &
      PF_PID=$!

      echo "Waiting for application..."
      for i in $(seq 1 20); do
        if curl -sf http://localhost:18080/actuator/health | grep -q '"status":"UP"'; then
          break
        fi
        sleep 3
      done

      curl -sf http://localhost:18080/actuator/health | grep -q '"status":"UP"' \
        || { echo "Application never became healthy."; cat /tmp/port-forward.log; exit 1; }

      echo "Creating Python virtual environment..."
      python3 -m venv .venv
      . .venv/bin/activate

      pip install -r tests/requirements.txt

      echo "Running smoke tests..."
      BASE_URL=http://localhost:18080 \
      python3 -m pytest tests/test_api.py \
        --junitxml=smoke-report.xml \
        -v

      echo "Smoke tests completed successfully."

      cleanup

  artifacts:
    when: always
    reports:
      junit: smoke-report.xml

# ---------------------------------------------------------
# STAGE 14 — DAST (OWASP ZAP)
# ---------------------------------------------------------
owasp-zap:
  stage: dast-scan
  tags:
    - local-k8s

  needs:
    - deploy

  script:
    - |
      set -e

      cleanup() {
        echo "Cleaning up port-forward..."

        if [ -n "${PF_PID:-}" ]; then
          sudo kill "$PF_PID" 2>/dev/null || true
        fi

        sudo pkill -f "kubectl.*port-forward.*18080" 2>/dev/null || true
      }

      trap cleanup EXIT

      APP_POD=$(sudo /usr/local/bin/kubectl get pod \
        -l app=applicationbib \
        --field-selector=status.phase=Running \
        --sort-by=.metadata.creationTimestamp \
        -o jsonpath='{.items[-1:].metadata.name}')

      if [ -z "$APP_POD" ]; then
        echo "No running application pod found."
        exit 1
      fi

      echo "Using pod: $APP_POD"

      sudo /usr/local/bin/kubectl port-forward "$APP_POD" 18080:8080 \
        >/tmp/zap-port-forward.log 2>&1 &
      PF_PID=$!

      echo "Waiting for application..."

      for i in $(seq 1 20); do
        if curl -sf http://localhost:18080/actuator/health >/dev/null; then
          break
        fi
        sleep 1
      done

      curl -sf http://localhost:18080/actuator/health >/dev/null || {
        echo "Application never became reachable."
        cat /tmp/zap-port-forward.log
        exit 1
      }

      echo "Application is reachable."

      # ---------------------------------------------------------
      # Generate fresh Firebase ID token
      # ---------------------------------------------------------

      echo "Generating Firebase ID token..."

      FIREBASE_RESPONSE=$(curl -sS \
        "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}" \
        -H "Content-Type: application/json" \
        --data-binary "{
          \"email\": \"${ZAP_TEST_EMAIL}\",
          \"password\": \"${ZAP_TEST_PASSWORD}\",
          \"returnSecureToken\": true
        }")

      echo "Firebase response fields:"
      echo "$FIREBASE_RESPONSE" | jq 'keys'

      ZAP_AUTH_TOKEN=$(echo "$FIREBASE_RESPONSE" | jq -r '.idToken')

      echo "Token length: ${#ZAP_AUTH_TOKEN}"
      echo "JWT parts: $(echo "$ZAP_AUTH_TOKEN" | awk -F. '{print NF}')"

      if [ -z "$ZAP_AUTH_TOKEN" ] || [ "$ZAP_AUTH_TOKEN" = "null" ]; then
        echo "Failed to obtain Firebase ID token."
        echo "$FIREBASE_RESPONSE" | jq -r '.error.message // "Unknown Firebase authentication error"'
        exit 1
      fi

      echo "Firebase ID token generated successfully."

      # ---------------------------------------------------------
      # Verify authenticated API access
      # ---------------------------------------------------------

      echo "Testing authenticated API access..."

      HTTP_STATUS=$(curl -s \
        -o /tmp/api-response.txt \
        -w "%{http_code}" \
        -H "Authorization: Bearer $ZAP_AUTH_TOKEN" \
        http://localhost:18080/project/getall)

      echo "API response status: $HTTP_STATUS"

      if [ "$HTTP_STATUS" != "200" ]; then
        echo "Authenticated API request failed."
        echo "Response body:"
        cat /tmp/api-response.txt
        echo "Application pod logs:"
        sudo /usr/local/bin/kubectl logs "$APP_POD" --tail=100 | tee app-pod-logs.txt
        exit 1
      fi

      echo "Authenticated API request succeeded."

      # ---------------------------------------------------------
      # OWASP ZAP
      # ---------------------------------------------------------

      echo "Starting authenticated OWASP ZAP scan..."

      set +e
      podman run --rm \
        --userns=keep-id \
        --network host \
        -v "$PWD":/zap/wrk:Z \
        docker.io/zaproxy/zap-stable \
        zap-baseline.py \
          -t http://localhost:18080/project/getall \
          -r zap-report.html \
          -J zap-report.json \
          -c zap-rules.conf \
          -z "-config replacer.full_list\(0\).description=FirebaseAuth \
              -config replacer.full_list\(0\).enabled=true \
              -config replacer.full_list\(0\).matchtype=REQ_HEADER \
              -config replacer.full_list\(0\).matchstr=Authorization \
              -config replacer.full_list\(0\).replacement=Bearer%20${ZAP_AUTH_TOKEN} \
              -config replacer.full_list\(0\).initiators= \
              -config replacer.full_list\(0\).matchregex=false"
      ZAP_EXIT_CODE=$?
      set -e

      echo "ZAP exit code: $ZAP_EXIT_CODE"

      # ---------------------------------------------------------
      # Fine-grained gating on specific critical alert IDs,
      # independent of the WARN/FAIL threshold in zap-rules.conf
      # ---------------------------------------------------------

      CRITICAL_ALERT_IDS="40018 40022 90019 90020 90025 90023 90022 10062 40012"

      if [ -f zap-report.json ]; then
        for ALERT_ID in $CRITICAL_ALERT_IDS; do
          FOUND=$(jq --arg id "$ALERT_ID" '[.site[].alerts[] | select(.pluginid == $id)] | length' zap-report.json)
          if [ "$FOUND" -gt 0 ]; then
            echo "Critical alert $ALERT_ID found in scan results. Failing job."
            exit 1
          fi
        done
      fi

      if [ "$ZAP_EXIT_CODE" -eq 1 ]; then
        echo "ZAP scan found FAIL-level issues. Failing the job."
        exit 1
      elif [ "$ZAP_EXIT_CODE" -eq 2 ]; then
        echo "ZAP scan found WARN-level issues only. Not failing the job, review zap-report.html."
      elif [ "$ZAP_EXIT_CODE" -ne 0 ]; then
        echo "ZAP scan exited with unexpected code $ZAP_EXIT_CODE."
        exit 1
      fi

      echo "ZAP scan completed."

  artifacts:
    when: always
    paths:
      - zap-report.html
      - zap-report.json
      - app-pod-logs.txt
    expire_in: 7 days

# -----------------------------------------------------------------------------
# STAGE 15 — ROLLBACK (only runs if post-deploy-smoke or owasp-zap failed)
# -----------------------------------------------------------------------------
rollback:
  stage: rollback
  tags:
    - local-k8s
  when: on_failure

  script:
    - echo "Post-deploy verification failed — rolling back..."
    - sudo /usr/local/bin/kubectl rollout undo deployment/applicationbib
    - sudo /usr/local/bin/kubectl rollout status deployment/applicationbib --timeout=90s