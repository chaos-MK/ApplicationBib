stages:
  - secrets
  - sast
  - dependency
  - test
  - lint
  - build
  - sbom
  - image-scan
  - smoke-test
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  GIT_DEPTH: "0"

# -----------------------------------------------------------------------------
# STAGE 1 — SECRET SCANNING
# -----------------------------------------------------------------------------
secret-scan:
  stage: secrets
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact

# -----------------------------------------------------------------------------
# STAGE 2a — SEMGREP
# -----------------------------------------------------------------------------
sast-semgrep:
  stage: sast
  image: python:3.12-slim
  script:
    - pip install semgrep
    - semgrep scan --config p/java --error

# -----------------------------------------------------------------------------
# STAGE 2b — SONARCLOUD
# -----------------------------------------------------------------------------
sonarqube:
  stage: sast
  image: maven:3.9-eclipse-temurin-21
  variables:
    SONAR_HOST_URL: https://sonarcloud.io
  script:
    - mvn clean verify -DskipTests sonar:sonar -Dsonar.token="$SONAR_TOKEN"

# -----------------------------------------------------------------------------
# STAGE 3 — SNYK
# -----------------------------------------------------------------------------
dependency-scan-snyk:
  stage: dependency
  image:
    name: snyk/snyk:maven
    entrypoint: [""]
  script:
    - snyk auth "$SNYK_TOKEN"
    - snyk test --severity-threshold=high

# -----------------------------------------------------------------------------
# STAGE 4 — BUILD & TEST
# -----------------------------------------------------------------------------
build-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21

  services:
    - postgres:16

  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: testdb
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
    SPRING_DATASOURCE_USERNAME: test
    SPRING_DATASOURCE_PASSWORD: test

  script:
    - mvn -B verify || (cat target/surefire-reports/*.txt && exit 1)

  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/*.xml

# -----------------------------------------------------------------------------
# STAGE 5 — DOCKERFILE LINT
# -----------------------------------------------------------------------------
dockerfile-lint:
  stage: lint
  image:
    name: hadolint/hadolint:latest-debian
    entrypoint: [""]
  script:
    - hadolint Dockerfile

# -----------------------------------------------------------------------------
# STAGE 6 — BUILD IMAGE
# -----------------------------------------------------------------------------
build-image:
  stage: build
  image: docker:24

  services:
    - docker:24-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# -----------------------------------------------------------------------------
# STAGE 7 — SBOM
# -----------------------------------------------------------------------------
sbom-syft:
  stage: sbom
  image: alpine:3.20

  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

  script:
    - syft dir:. -o cyclonedx-json=sbom.json

  artifacts:
    paths:
      - sbom.json
    expire_in: 30 days

# -----------------------------------------------------------------------------
# STAGE 8 — TRIVY
# -----------------------------------------------------------------------------
image-scan-trivy:
  stage: image-scan

  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  needs:
    - build-image

  script:
    - >
      trivy image
      --username "$CI_REGISTRY_USER"
      --password "$CI_REGISTRY_PASSWORD"
      --severity CRITICAL,HIGH
      --exit-code 1
      "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# -----------------------------------------------------------------------------
# STAGE 8b — GRYPE
# -----------------------------------------------------------------------------
image-scan-grype:
  stage: image-scan

  image: docker:24

  services:
    - docker:24-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  needs:
    - build-image

  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker save "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" -o image.tar
    - grype docker-archive:image.tar --fail-on high

# -----------------------------------------------------------------------------
# STAGE 9 — SMOKE TEST
# -----------------------------------------------------------------------------
smoke-test:
  stage: smoke-test

  image: docker:24

  services:
    - docker:24-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  needs:
    - build-image

  before_script:
    - apk add --no-cache python3 py3-pip curl

  script:
    # Install pytest
    - pip3 install -r tests/requirements.txt

    # Create network
    - docker network create testnet

    # Start PostgreSQL
    - >
      docker run -d
      --name pg
      --network testnet
      -e POSTGRES_USER=test
      -e POSTGRES_PASSWORD=test
      -e POSTGRES_DB=testdb
      postgres:16

    # Wait until PostgreSQL is ready
    - |
      until docker exec pg pg_isready -U test -d testdb; do
        echo "Waiting for PostgreSQL..."
        sleep 2
      done

    # Login to registry
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

    # Start application
    - >
      docker run -d
      --name app
      --network testnet
      -e SPRING_DATASOURCE_URL=jdbc:postgresql://pg:5432/testdb
      -e SPRING_DATASOURCE_USERNAME=test
      -e SPRING_DATASOURCE_PASSWORD=test
      "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

    # Wait until Spring Boot is ready
    - |
      until docker exec app wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1; do
        echo "Waiting for Spring Boot..."
        sleep 5
      done

    # Run pytest INSIDE the same Docker network
    - >
      docker run --rm
      --network testnet
      -e BASE_URL=http://app:8080
      -v "$CI_PROJECT_DIR/tests:/tests"
      -w /tests
      python:3.12
      sh -c "
        pip install -r requirements.txt &&
        pytest test_api.py -v --junitxml=smoke-report.xml
      "

    # Copy report back to GitLab workspace
    - cp tests/smoke-report.xml .

  after_script:
    - docker logs app || true
    - docker logs pg || true
    - docker rm -f app pg || true
    - docker network rm testnet || true

  artifacts:
    when: always
    reports:
      junit: smoke-report.xml

# -----------------------------------------------------------------------------
# STAGE 10 — DEPLOY
# -----------------------------------------------------------------------------
deploy:
  stage: deploy

  needs:
    - build-test
    - smoke-test

  script:
    - echo "Deploy goes here."