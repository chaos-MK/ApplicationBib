stages:
  - secrets
  - sast
  - dependency
  - test
  - lint
  - build
  - sbom
  - image-scan
  - smoke-test
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

variables:
  GIT_DEPTH: "0"

# -----------------------------------------------------------------------------
# STAGE 1 — SECRET SCANNING
# -----------------------------------------------------------------------------
secret-scan:
  stage: secrets
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose --redact

# -----------------------------------------------------------------------------
# STAGE 2a — SEMGREP
# -----------------------------------------------------------------------------
sast-semgrep:
  stage: sast
  image: python:3.12-slim
  script:
    - pip install semgrep
    - semgrep scan --config p/java --error

# -----------------------------------------------------------------------------
# STAGE 2b — SONARCLOUD
# -----------------------------------------------------------------------------
sonarqube:
  stage: sast
  image: maven:3.9-eclipse-temurin-21
  variables:
    SONAR_HOST_URL: https://sonarcloud.io
  script:
    - mvn clean verify -DskipTests sonar:sonar -Dsonar.token="$SONAR_TOKEN"

# -----------------------------------------------------------------------------
# STAGE 3 — SNYK
# -----------------------------------------------------------------------------
dependency-scan-snyk:
  stage: dependency
  image:
    name: snyk/snyk:maven
    entrypoint: [""]
  script:
    - snyk auth "$SNYK_TOKEN"
    - snyk test --severity-threshold=high

# -----------------------------------------------------------------------------
# STAGE 4 — BUILD & TEST
# -----------------------------------------------------------------------------
build-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21

  services:
    - postgres:16

  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: testdb
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/testdb
    SPRING_DATASOURCE_USERNAME: test
    SPRING_DATASOURCE_PASSWORD: test

  script:
    - mvn -B verify || (cat target/surefire-reports/*.txt && exit 1)

  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/*.xml

# -----------------------------------------------------------------------------
# STAGE 5 — DOCKERFILE LINT
# -----------------------------------------------------------------------------
dockerfile-lint:
  stage: lint
  image:
    name: hadolint/hadolint:latest-debian
    entrypoint: [""]
  script:
    - hadolint Dockerfile

# -----------------------------------------------------------------------------
# STAGE 6 — BUILD IMAGE (Buildah, no daemon)
# -----------------------------------------------------------------------------
build-image:
  stage: build
  image: quay.io/buildah/stable

  variables:
    STORAGE_DRIVER: vfs

  script:
    - buildah login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - buildah build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - buildah push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# -----------------------------------------------------------------------------
# STAGE 7 — SBOM
# -----------------------------------------------------------------------------
sbom-syft:
  stage: sbom
  image: alpine:3.20

  before_script:
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

  script:
    - syft dir:. -o cyclonedx-json=sbom.json

  artifacts:
    paths:
      - sbom.json
    expire_in: 30 days

# -----------------------------------------------------------------------------
# STAGE 8 — TRIVY
# -----------------------------------------------------------------------------
image-scan-trivy:
  stage: image-scan

  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  needs:
    - build-image

  script:
    - >
      trivy image
      --username "$CI_REGISTRY_USER"
      --password "$CI_REGISTRY_PASSWORD"
      --severity CRITICAL,HIGH
      --exit-code 1
      "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# -----------------------------------------------------------------------------
# STAGE 8b — GRYPE (Skopeo, no daemon)
# -----------------------------------------------------------------------------
image-scan-grype:
  stage: image-scan

  image:
    name: quay.io/skopeo/stable
    entrypoint: [""]

  needs:
    - build-image

  before_script:
    - curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

  script:
    - skopeo login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - skopeo copy "docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" docker-archive:image.tar
    - grype docker-archive:image.tar --fail-on high

# -----------------------------------------------------------------------------
# STAGE 9 — SMOKE TEST
# -----------------------------------------------------------------------------
smoke-test:
  stage: smoke-test
  image: python:3.12

  services:
    - docker:24-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    BASE_URL: http://docker:8080

  needs:
    - build-image

  before_script:
    - apt-get update
    - apt-get install -y docker.io

  script:
    - pip install -r tests/requirements.txt
    - docker network create testnet
    - >
      docker run -d
      --name pg
      --network testnet
      -e POSTGRES_USER=test
      -e POSTGRES_PASSWORD=test
      -e POSTGRES_DB=testdb
      postgres:16
    - >
      for i in $(seq 1 15); do
        docker exec pg pg_isready -U test && break
        sleep 2
      done
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - >
      docker run -d
      --name app
      --network testnet
      --read-only
      --tmpfs /tmp
      --cap-drop=ALL
      --memory=512m
      --cpus=1
      -p 8080:8080
      -e SPRING_DATASOURCE_URL=jdbc:postgresql://pg:5432/testdb
      -e SPRING_DATASOURCE_USERNAME=test
      -e SPRING_DATASOURCE_PASSWORD=test
      "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - >
      for i in $(seq 1 20); do
        curl -sf "$BASE_URL/actuator/health" && break
        echo "waiting for app..." && sleep 3
      done
    - docker ps -a
    - docker logs app || true
    - pytest tests/test_api.py --junitxml=smoke-report.xml -v

  artifacts:
    when: always
    reports:
      junit: smoke-report.xml

# -----------------------------------------------------------------------------
# STAGE 10 — DEPLOY
# -----------------------------------------------------------------------------
deploy:
  stage: deploy

  needs:
    - secret-scan
    - sast-semgrep
    - sonarqube
    - dependency-scan-snyk
    - build-test
    - dockerfile-lint
    - build-image
    - sbom-syft
    - image-scan-trivy
    - image-scan-grype
    - smoke-test

  script:
    - echo "Deploy goes here."