apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ritual-growth-ui-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: ritual-growth-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
